# Weekly check that the official links shown to victims (bank, portal, helpline pages) still work.
name: link-check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_official_links.py
