services:
  - type: web
    name: cyberguard-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Set the values below in the Render dashboard (sync: false keeps them out of git).
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLERK_ISSUER_URL
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      - key: URLHAUS_AUTH_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
